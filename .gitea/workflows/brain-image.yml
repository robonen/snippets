# Образ сервера brain: сборка на каждый пуш в main и публикация в реестр Gitea.
#
# Образ живёт в пакетах ЭТОГО репозитория (имя пакета = имя репозитория),
# а не среди личных пакетов пользователя, и публикуется ТОЛЬКО тегом latest:
# История версий не нужна — деплой всегда тянет свежий образ.
#
# Дальше образ тянется в Proxmox 9.1 напрямую: Storage → «Pull from OCI
# Registry» → git.robonen.ru/robonen/snippets:latest → Create CT (том на
# /data, переменные в Options). Подробности — brain/docs/04-server.md §3.
name: brain-image

on:
  push:
    branches: [main]
    paths:
      - 'brain/**'
      - 'sync-crdt/**'
      - 'vite-layers/**'
      - '.gitea/workflows/brain-image.yml'
  workflow_dispatch:

# Два пуша в main не должны гоняться за общий тег latest.
concurrency:
  group: brain-image-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

env:
  REGISTRY: git.robonen.ru
  IMAGE: ${{ github.repository }} # -> git.robonen.ru/robonen/snippets, пакет репозитория

jobs:
  build:
    name: build (latest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Log in to ${{ env.REGISTRY }}
        env:
          REGISTRY_USER: ${{ secrets.REGISTRY_USER || github.actor }}
          REGISTRY_TOKEN: ${{ secrets.REGISTRY_TOKEN || secrets.GITHUB_TOKEN }}
        run: echo "$REGISTRY_TOKEN" | docker login "$REGISTRY" -u "$REGISTRY_USER" --password-stdin

      - name: Build and push
        run: |
          set -euo pipefail
          ref="$REGISTRY/$IMAGE:latest"
          echo "==> Building $ref"
          docker build -f brain/Dockerfile -t "$ref" .
          echo "==> Pushing $ref"
          docker push "$ref"
